<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOP 100 - Tabellone TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .slot-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between overflow-x-hidden select-none">

  <!-- LOBBY MODAL: IMPOSTAZIONE SQUADRE -->
  <div id="lobbyModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-2xl w-full shadow-2xl">
      <div class="text-center mb-6">
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-rose-500 to-indigo-500">TOP 100 LOBBY</h1>
        <p class="text-slate-400 text-sm mt-1">Configura il numero di squadre e i loro colori prima di iniziare</p>
      </div>

      <div id="teamsContainer" class="space-y-3 max-h-72 overflow-y-auto pr-2 mb-6">
        <!-- Generato dinamicamente -->
      </div>

      <div class="flex gap-3 mb-6">
        <button onclick="addTeamField()" class="flex-1 py-3 px-4 rounded-xl border border-dashed border-slate-700 hover:border-slate-500 text-slate-300 font-bold transition flex items-center justify-center gap-2">
          <span>➕ Aggiungi Squadra</span>
        </button>
      </div>

      <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-lg shadow-lg shadow-emerald-500/30 transition">
        AVVIA TABELLONE TV 🚀
      </button>
    </div>
  </div>

  <!-- HEADER / SCOREBOARD TV -->
  <header class="bg-slate-900/90 border-b border-slate-800 px-6 py-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-4">
      <div class="text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-amber-400 to-rose-500">TOP 100</div>
      <div class="h-6 w-px bg-slate-800"></div>
      <div id="categoryDisplay" class="text-sm font-semibold text-slate-300">Caricamento Categoria...</div>
    </div>

    <!-- Live Teams Scoreboard -->
    <div id="scoreboardDisplay" class="flex items-center gap-4">
      <!-- Generato dinamicamente -->
    </div>

    <div class="flex items-center gap-2">
      <button onclick="openQRModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition flex items-center gap-1.5">
        <span>📱 Connetti Telefoni</span>
      </button>
      <button onclick="toggleFullscreen()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-bold transition">
        ⛶ Schermo Intero
      </button>
      <button onclick="document.getElementById('lobbyModal').classList.remove('hidden')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-400">
        ⚙️ Squadre
      </button>
    </div>
  </header>

  <!-- GRIGLIA TABELLONE 10x10 (100 CASELLE) -->
  <main class="flex-1 p-4 flex items-center justify-center">
    <div id="gridContainer" class="grid grid-cols-10 gap-1.5 w-full max-w-[1700px] h-[calc(100vh-120px)]">
      <!-- 100 caselle generate dinamicamente -->
    </div>
  </main>

  <!-- POPUP RIVELAZIONE AL CENTRO -->
  <div id="revealBanner" class="fixed inset-0 pointer-events-none z-40 flex items-center justify-center opacity-0 transition-opacity duration-300">
    <div id="bannerCard" class="bg-slate-900/95 border-2 border-amber-400 rounded-3xl p-8 text-center shadow-2xl scale-75 transform transition duration-300 max-w-lg">
      <div id="bannerRank" class="text-6xl font-black text-amber-400 mb-2">#72</div>
      <div id="bannerTitle" class="text-3xl font-bold text-white mb-3">Nome Titolo</div>
      <div id="bannerTeam" class="text-base font-bold text-emerald-400">Preso da Squadra Rossa (+72 pt)</div>
    </div>
  </div>

  <!-- QR CODE MODAL -->
  <div id="qrModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center max-w-sm w-full">
      <h3 class="text-lg font-bold mb-1">Inquadra per Giocare</h3>
      <p class="text-xs text-slate-400 mb-4">Scansiona con lo smartphone per accedere al controller</p>
      <div id="qrcode" class="flex justify-center bg-white p-3 rounded-2xl mx-auto w-fit mb-4"></div>
      <div id="phoneUrl" class="text-xs font-mono text-indigo-400 break-all mb-4"></div>
      <button onclick="closeQRModal()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-bold text-sm">Chiudi</button>
    </div>
  </div>

  <script>
    const socket = io();
    let teams = [
      { id: 't1', name: 'Squadra Rossa', color: '#ef4444', icon: '🔥', score: 0 },
      { id: 't2', name: 'Squadra Blu', color: '#3b82f6', icon: '⚡', score: 0 }
    ];
    let revealed = {};

    const PRESET_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
    const PRESET_ICONS = ['🔥', '⚡', '🦅', '🦁', '🚀', '👑', '🦈', '💎'];

    // Inizializza 100 caselle vuote
    function buildGrid() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';
      for (let i = 1; i <= 100; i++) {
        const slot = document.createElement('div');
        slot.id = `slot-${i}`;
        slot.className = "slot-card bg-slate-900/80 border border-slate-800/80 rounded-lg flex flex-col justify-between p-1.5 text-center relative overflow-hidden select-none";
        slot.innerHTML = `
          <div class="flex items-center justify-between text-[11px] font-black text-slate-500">
            <span>#${i}</span>
            <span class="text-[9px] opacity-40">${i} pt</span>
          </div>
          <div class="font-bold text-[11px] leading-tight text-slate-400 truncate px-0.5">???</div>
          <div class="h-1 rounded-full bg-slate-800"></div>
        `;
        container.appendChild(slot);
      }
    }

    // Renderizza lo stato della singola casella
    function updateSlotUI(rank, info) {
      const el = document.getElementById(`slot-${rank}`);
      if (!el || !info) return;

      el.style.borderColor = info.teamColor;
      el.style.backgroundColor = `${info.teamColor}22`;
      el.innerHTML = `
        <div class="flex items-center justify-between text-[11px] font-black" style="color: ${info.teamColor}">
          <span>#${rank}</span>
          <span class="text-[9px] bg-slate-950/60 px-1 rounded">+${info.points}</span>
        </div>
        <div class="font-black text-[11px] text-white leading-tight truncate px-0.5">${info.itemName}</div>
        <div class="text-[9px] font-semibold truncate text-slate-300" style="color: ${info.teamColor}">
          ${info.playerName}
        </div>
      `;
    }

    // Renderizza lo scoreboard in alto
    function renderScoreboard() {
      const sb = document.getElementById('scoreboardDisplay');
      sb.innerHTML = teams.map(t => `
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl border" style="border-color: ${t.color}40; background-color: ${t.color}15">
          <span class="text-lg">${t.icon}</span>
          <div>
            <div class="text-[10px] font-bold text-slate-400 leading-none">${t.name}</div>
            <div class="text-base font-black text-white leading-tight">${t.score} <span class="text-[10px] font-normal text-slate-400">pt</span></div>
          </div>
        </div>
      `).join('');
    }

    // Gestione Lobby Setup
    function renderLobbyInputs() {
      const cont = document.getElementById('teamsContainer');
      cont.innerHTML = teams.map((t, idx) => `
        <div class="flex items-center gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800">
          <span class="text-xl">${t.icon}</span>
          <input type="text" value="${t.name}" onchange="updateTeamName(${idx}, this.value)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm font-bold text-white focus:outline-none focus:border-indigo-500">
          <input type="color" value="${t.color}" onchange="updateTeamColor(${idx}, this.value)" class="w-9 h-9 rounded-lg cursor-pointer bg-transparent border-0">
          ${teams.length > 2 ? `<button onclick="removeTeamField(${idx})" class="text-rose-400 hover:text-rose-300 p-1.5">🗑️</button>` : ''}
        </div>
      `).join('');
    }

    function addTeamField() {
      if (teams.length >= 8) return;
      const nextIdx = teams.length;
      teams.push({
        id: `t${Date.now()}`,
        name: `Squadra ${nextIdx + 1}`,
        color: PRESET_COLORS[nextIdx % PRESET_COLORS.length],
        icon: PRESET_ICONS[nextIdx % PRESET_ICONS.length],
        score: 0
      });
      renderLobbyInputs();
    }

    function removeTeamField(idx) {
      if (teams.length <= 2) return;
      teams.splice(idx, 1);
      renderLobbyInputs();
    }

    function updateTeamName(idx, val) { teams[idx].name = val; }
    function updateTeamColor(idx, val) { teams[idx].color = val; }

    function startGame() {
      socket.emit('setupTeams', teams);
      document.getElementById('lobbyModal').classList.add('hidden');
    }

    // Ricezione aggiornamenti Socket.io
    socket.on('gameState', (data) => {
      document.getElementById('categoryDisplay').innerText = data.categoryTitle;
      teams = data.teams;
      revealed = data.revealed || {};
      renderScoreboard();
      buildGrid();
      Object.keys(revealed).forEach(rank => {
        updateSlotUI(rank, revealed[rank]);
      });
    });

    socket.on('boardUpdated', (payload) => {
      const { rank, data, teams: updatedTeams } = payload;
      teams = updatedTeams;
      revealed[rank] = data;
      renderScoreboard();
      updateSlotUI(rank, data);
      triggerCelebration(rank, data);
    });

    // Effetto visivo e sonoro al punto segnato
    function triggerCelebration(rank, info) {
      const banner = document.getElementById('revealBanner');
      const bCard = document.getElementById('bannerCard');
      document.getElementById('bannerRank').innerText = `#${rank}`;
      document.getElementById('bannerTitle').innerText = info.itemName;
      document.getElementById('bannerTeam').innerText = `Preso da ${info.teamName} - ${info.playerName} (+${info.points} pt)`;

      bCard.style.borderColor = info.teamColor;
      banner.classList.remove('opacity-0');
      bCard.classList.remove('scale-75');

      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 }
      });

      setTimeout(() => {
        banner.classList.add('opacity-0');
        bCard.classList.add('scale-75');
      }, 2500);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function openQRModal() {
      const modal = document.getElementById('qrModal');
      const qrDiv = document.getElementById('qrcode');
      const phoneUrl = `${window.location.origin}/play.html`;
      qrDiv.innerHTML = "";
      new QRCode(qrDiv, { text: phoneUrl, width: 160, height: 160 });
      document.getElementById('phoneUrl').innerText = phoneUrl;
      modal.classList.remove('hidden');
    }

    function closeQRModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    // Setup iniziale
    buildGrid();
    renderLobbyInputs();
  </script>
</body>
</html>
